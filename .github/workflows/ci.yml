name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Sur main, on ne coupe jamais un run en cours (évite un publish interrompu).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: sherlock-app:ci
  # Outils épinglés par digest (comme les images de base des Dockerfile).
  RUFF: ghcr.io/astral-sh/ruff:0.16.9@sha256:fd4a00e8f586c07495822a1c93702737b9a98d826b76d460caa514df7794f259
  TRIVY: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  COSIGN: gcr.io/projectsigstore/cosign@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ruff check (règles dans ruff.toml)
        run: docker run --rm -v "$PWD":/src -w /src "$RUFF" check .

  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build de l'image
        run: docker build -t "$IMAGE" .

      - name: Démarrage avec le durcissement de prod
        # Mêmes contraintes que le docker-compose du NAS : utilisateur 1000,
        # rootfs en lecture seule, aucune capability, /tmp en noexec.
        run: |
          docker run -d --name smoke \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m --user 1000:1000 \
            -e ALLOWED_ORIGINS=https://allowed.example \
            -p 127.0.0.1:7100:7100 "$IMAGE"

      - name: HEALTHCHECK Docker
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 3
          done
          docker logs smoke
          exit 1

      - name: /health répond 200, sans être limité par le rate limit (30/h)
        run: |
          for _ in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7100/health)
            test "$code" = 200
          done

      - name: Un nom d'utilisateur invalide est rejeté (400)
        # Reste déterministe : ne lance aucun scan Sherlock vers Internet.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'http://127.0.0.1:7100/api/sherlock-stream?username=-x')
          test "$code" = 400

      - name: CORS autorise l'origine configurée, refuse les autres
        run: |
          allowed=$(curl -s -i -H 'Origin: https://allowed.example' \
            'http://127.0.0.1:7100/api/sherlock-stream?username=-x' \
            | tr -d '\r' | grep -ci '^access-control-allow-origin: https://allowed.example$' || true)
          other=$(curl -s -i -H 'Origin: https://evil.example' \
            'http://127.0.0.1:7100/api/sherlock-stream?username=-x' \
            | grep -ci '^access-control-allow-origin' || true)
          test "$allowed" = 1
          test "$other" = 0

      - name: Le binaire sherlock est présent dans l'image
        run: docker exec smoke sherlock --version

      - name: Logs du conteneur (en cas d'échec)
        if: failure()
        run: docker logs smoke

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dépendances, secrets et Dockerfile (bloquant)
        run: |
          docker run --rm -v "$PWD":/src "$TRIVY" fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --exit-code 1 /src

      - name: Build de l'image
        run: docker build -t "$IMAGE" .

      - name: Paquets OS de l'image (bloquant, correctifs disponibles)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
            --pkg-types os --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"

      - name: Paquets Python de l'image (bloquant, correctifs disponibles)
        # Exclut setuptools/_vendor : copies embarquées par l'image de base
        # (jaraco.context, wheel), non utilisées par l'app ; le vrai wheel de
        # l'image est à jour.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
            --pkg-types library --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs usr/local/lib/python3.11/site-packages/setuptools/_vendor \
            --exit-code 1 "$IMAGE"

  # Publie l'image validée : uniquement sur push main, une fois les 3 gates verts.
  # Ne déploie rien : le déploiement reste géré par le pipeline Ansible du repo
  # cyberlab-infra, qui référence l'image par digest.
  publish:
    needs: [lint, build-and-smoke-test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push sur GHCR
      id-token: write   # signature Cosign sans clé (OIDC GitHub)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build et push (tag = SHA du commit)
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$REPO:${{ github.sha }}" .
          docker push "$REPO:${{ github.sha }}"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$REPO:${{ github.sha }}")
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Signature Cosign (sans clé, via OIDC)
        run: |
          docker run --rm \
            -e ACTIONS_ID_TOKEN_REQUEST_URL \
            -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -e DOCKER_CONFIG=/dockercfg \
            -v "$HOME/.docker":/dockercfg:ro \
            "$COSIGN" sign --yes "$DIGEST"

      - name: Digest à reporter dans le compose
        run: |
          {
            echo "### Image publiée et signée"
            echo
            echo "\`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # A ajouter a la fin du job publish de chaque backend (meme bloc partout).
      # Ouvre une PR sur cyberlab-infra qui remplace le digest dans le
      # compose. Secret requis dans le depot backend : CYBERLAB_BACKENDS_TOKEN
      # (PAT fine-grained limite a cyberlab-infra : Contents + Pull requests en ecriture).
      - name: PR de bump du digest dans cyberlab-infra
        env:
          GH_TOKEN: ${{ secrets.CYBERLAB_BACKENDS_TOKEN }}
          TARGET: NAS-HomeServer/cyberlab-infra
        run: |
          set -euo pipefail
          NAME="${GITHUB_REPOSITORY##*/}"
          BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          BRANCH="bump/${NAME}-${GITHUB_SHA::7}"
          gh auth setup-git
          gh repo clone "$TARGET" backends -- --depth 1
          cd backends
          sed -i -E "s|${BASE}@sha256:[a-f0-9]{64}|${DIGEST}|" cyberlab/docker-compose.yml
          if git diff --quiet; then
            echo "Digest deja a jour, rien a faire."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "deploy: ${NAME} -> ${GITHUB_SHA::7} (image signee)"
          git push origin "$BRANCH"
          gh pr create --repo "$TARGET" --base main --head "$BRANCH" \
            --title "deploy: ${NAME} -> ${GITHUB_SHA::7}" \
            --body "Nouvelle image signee : \`${DIGEST}\`. Source : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"